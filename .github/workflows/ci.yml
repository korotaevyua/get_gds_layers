name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # PVS ships its own Python; keep the script runnable on old versions.
      - run: vermin --no-tips --eval-annotations --violations -t=3.6- pvs/get_all_gds_layers.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Old Pythons (as shipped with EDA tools) only exist for older runner images.
        include:
          - { os: ubuntu-22.04, python: "3.7" }
          - { os: ubuntu-22.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # tclsh runs calibre/get_all_gds_layers.tcl against a fake `layout` command.
      - run: sudo apt-get install -y tcl
      - run: pip install pytest
      - run: pytest -v -rs
