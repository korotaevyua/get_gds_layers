[tool.ruff]
target-version = "py37"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# Keep %-formatting and plain f-strings readable as-is.
ignore = ["UP031", "UP032"]

[tool.ruff.lint.isort]
known-first-party = ["get_all_gds_layers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
